:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#1f1f1f);--ink:light-dark(#1f1f1f,#e3e3e3);--mut:light-dark(#5f6368,#a8abaf);
--hd:light-dark(#f8f9fa,#2a2a2a);--ln:light-dark(#e1e3e1,#3a3a3a);--sel:light-dark(#e8f0fe,#22324d);--blue:light-dark(#0b57d0,#8ab4f8);
--brand:#188038;--pop:light-dark(#ffffff,#2b2b2b);--chip:light-dark(#f1f3f4,#333);
--post:light-dark(#d3e3fd,#28426b);--poc:light-dark(#c4eed0,#1e4a2b);--pipe:light-dark(#e9ddff,#43345f);--blog:light-dark(#c2eff0,#1b4a4b);--tool:light-dark(#ffdcc0,#5a3a1e);--learn:light-dark(#eceff1,#3a3d40);
--hi:light-dark(#c4eed0,#1e4a2b);--med:light-dark(#feefc3,#5a4a12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 PulseRoboto,Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px 0}
.logo{width:28px;height:28px;border-radius:5px;background:var(--brand);display:grid;place-items:center;flex:none}
.top h1{font-size:18px;font-weight:400;margin:0;white-space:nowrap}
.stale{background:light-dark(#feefc3,#5a4a12);color:light-dark(#7a4f00,#fde293);border-radius:12px;padding:2px 10px;font-size:12px;white-space:nowrap}
.top .sub{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:2px 12px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln)}
.tab{border:0;background:none;padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;font-size:14px;color:var(--mut);display:inline-flex;gap:6px;align-items:center;min-height:44px;white-space:nowrap;flex:none}
.tab:hover{color:var(--ink)}.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
.tab .c{font-size:12px;background:var(--chip);border-radius:9px;padding:0 7px;color:var(--mut);font-weight:400}
.tab.on .c{background:color-mix(in srgb,var(--brand),transparent 85%);color:var(--brand)}
.main{flex:1;display:flex;min-height:0}
.side{width:260px;flex:none;border-right:1px solid var(--ln);overflow:auto;background:var(--bg);display:flex;flex-direction:column}
.side .sec{padding:10px 14px;border-bottom:1px solid var(--ln)}
.search{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:0 12px;height:36px}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:16px}
.shd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;color:var(--mut);font-size:12px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:4px 0;font-size:12px}
details.f{border-bottom:1px solid var(--ln)}
details.f summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;align-items:center;gap:6px;font-weight:500;min-height:40px}
details.f summary::-webkit-details-marker{display:none}
details.f summary::before{content:'▸';display:inline-block;width:12px;color:var(--mut);font-size:11px}
details.f[open] summary::before{content:'▾'}
.dhd{display:none}
.more{border:0;background:none;color:var(--blue);cursor:pointer;padding:6px;font-size:12px}
details.f summary .n{margin-left:auto;background:var(--blue);color:var(--bg);border-radius:9px;padding:0 7px;font-size:11px;font-weight:500}
.fl{padding:0 6px 8px 20px}
.fl input[type=search]{width:calc(100% - 8px);margin:0 0 6px;padding:5px 8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);font-size:16px}
.opt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;min-height:30px}
.opt:hover{background:var(--hd)}
.opt .c{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.opt.zero{opacity:.38;cursor:not-allowed}
.opt.zero:hover{background:none}
.opt.zero:hover .c{display:inline}
.tab.off{opacity:.45}
.opt .only{display:none;border:0;background:none;color:var(--blue);cursor:pointer;font-size:12px;padding:0 4px}
.opt:hover .only{display:inline}
.opt:hover .c{display:none}
.vw .opt{padding-left:0}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.sbox{position:relative;width:min(460px,100%);flex:0 1 auto;min-width:0}
.sbox .search{width:100%}
.qn{color:var(--mut);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qx{border:0;background:none;color:var(--mut);font-size:20px;width:32px;height:32px;margin-right:-8px;border-radius:50%;cursor:pointer;flex:none}
.qx:hover{background:color-mix(in srgb,var(--chip),var(--ink) 8%);color:var(--ink)}
.sug{position:absolute;left:0;right:0;top:42px;z-index:25;background:var(--pop);border:1px solid var(--ln);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0/.16);max-height:min(420px,60vh);overflow:auto;display:none;padding:4px 0}
.sug.on{display:block}
.sgh{color:var(--mut);font-size:11.5px;padding:8px 14px 2px}
.sg{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;min-height:38px}
.sg.act,.sg:hover{background:var(--sel)}
.sg .k{color:var(--mut);flex:none}.sg .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sg .n{color:var(--mut);font-size:12px;flex:none}
.sgf{color:var(--mut);font-size:11.5px;padding:6px 14px 4px;border-top:1px solid var(--ln);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;padding:8px 12px 0}
.tools>.search{width:min(420px,100%)}
.tools .btn{flex:none}
@media(max-width:600px){.sbox{flex:1 1 auto;width:auto}.lg{display:none}}
.newb{display:inline-block;background:var(--brand);color:#fff;border-radius:4px;font-size:10px;font-weight:500;padding:0 5px;margin-right:6px;vertical-align:1px}
#newb.on{background:var(--sel);border-color:var(--blue);color:var(--blue)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px 8px;border-bottom:1px solid var(--ln);min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sel);color:var(--blue);border-radius:14px;padding:3px 4px 3px 10px;font-size:12px}
.chip b{font-weight:400;color:var(--mut)}
.chip button{border:0;background:none;color:inherit;cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1}
.chip button:hover{background:color-mix(in srgb,var(--blue),transparent 85%)}
.hint{color:var(--mut)}
.btn{height:32px;padding:0 10px;border:1px solid var(--ln);background:var(--bg);border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hd)}.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn .n{background:var(--blue);color:var(--bg);border-radius:9px;padding:0 6px;font-size:11px}
.fbtn{display:none}
.wrap{flex:1;overflow:auto;--tw:320px;scroll-snap-type:x proximity;scroll-padding-left:calc(40px + var(--tw))}
thead th[data-k]:not(.tc){scroll-snap-align:start}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:0 8px;height:32px;text-align:left;vertical-align:middle;max-width:var(--w,180px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wraptxt td{white-space:normal;vertical-align:top;padding-block:7px}
thead th{position:sticky;top:0;background:var(--hd);color:var(--ink);font-weight:500;z-index:2;cursor:pointer;user-select:none}
thead th{position:sticky}
.cr{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:5}
.cr:hover,.cr.on{background:var(--blue);opacity:.5}
@media(pointer:coarse){.cr{width:16px}}
body.colrs,body.colrs *{cursor:col-resize!important;user-select:none}
thead th:hover{background:color-mix(in srgb,var(--hd),var(--ink) 6%)}
.rn{position:sticky;left:0;background:var(--hd);color:var(--mut);text-align:center;width:40px;min-width:40px;font-size:11px;z-index:1;cursor:default}
thead .rn{z-index:3}
.tc{position:sticky;left:40px;background:var(--bg);z-index:1;box-shadow:2px 0 0 var(--ln);width:var(--tw);min-width:var(--tw);max-width:var(--tw)}
thead .tc{background:var(--hd);z-index:3}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:color-mix(in srgb,var(--bg),var(--ink) 4%)}
tbody tr.r.cur td{background:var(--sel)}
tbody tr.r.cur td.rn{background:var(--blue);color:var(--bg)}
.tc a{color:var(--blue);text-decoration:none;margin-right:6px}
.det td{white-space:normal;background:var(--hd);height:auto;padding:0;max-width:none}

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FAM=[['Redshift',/redshift/i],['Glue',/\bglue\b/i],['Athena',/athena/i],['EMR',/\bemr\b/i],['Kinesis',/kinesis|\bkpl\b|\bkcl\b/i],['MSK / Kafka',/\bmsk\b|kafka/i],['Flink',/flink/i],['Firehose',/firehose/i],['Iceberg / S3 Tables',/iceberg|s3 tables/i],['Lake Formation',/lake formation/i],['Zero-ETL / DMS',/zero-etl|\bdms\b/i],['MWAA / Airflow',/mwaa|airflow/i],['Step Functions',/step functions/i],['dbt',/\bdbt\b/i],['DuckDB',/duckdb/i],['Lambda',/lambda/i],['OpenSearch',/opensearch/i],['SageMaker',/sagemaker/i],['Bedrock / AI agents',/bedrock|agentcore|\bmcp\b|agent skills|kiro/i],['QuickSight / Quick',/quick ?sight|amazon quick\b/i]];
const ORD={a:['Build a tool','Small PoC','Pipeline','Own blog','Post','Learn only','Skip'],p:['High','Med','Low']};
const FACETS=[
 {k:'fam',l:'AWS services',get:r=>r.fam,open:1},
 {k:'p',l:'Priority',get:r=>[r.p],ord:ORD.p,open:1},
 {k:'a',l:'What to do',get:r=>[r.a],ord:ORD.a},
 {k:'fit',l:'My experience',get:r=>[r.fit],ord:['Used it','New to me','Off path']},
 {k:'ty',l:'Kind of post',get:r=>r.ty},
 {k:'seed',l:'Idea it gives',get:r=>[r.seed]},
 {k:'g',l:'Topic',get:r=>[r.g]},
 {k:'st',l:'Used by me?',get:r=>[r.st]}];
const COL={d:{l:'Published',w:92,h:'Date AWS published the post'},a:{l:'What to do',w:110,h:'Post, Small PoC, Pipeline, Own blog, Build a tool, Learn only or Skip'},p:{l:'Priority',w:80,h:'High, Med or Low, from your stack'},
 fam:{l:'AWS services',w:210,h:'Services the post is about'},ty:{l:'Kind of post',w:200,h:'Customer story, best practice, comparison, how-to…'},fit:{l:'My experience',w:110,h:'Used it, New to me or Off path'},
 seed:{l:'Idea it gives',w:140,h:'Tool idea, Service idea or Architect knowledge'},dec:{l:'Trade-off it covers',w:340,h:'The design choice this post helps you make (A vs B)'},kp:{l:'Key points',w:420,h:'2–4 short points from the post'},
 g:{l:'Topic',w:180,h:'Broader theme, e.g. Streaming, Governance'},at:{l:'Fits my project',w:260,h:'Which of your repos or planned PoCs it feeds'},aws:{l:'AWS category · level',w:170,h:'AWS blog category and level (100 basic → 400 expert)'},
 au:{l:'Company / authors',w:240,h:'Customer company and the authors'},st:{l:'Used by me?',w:110,h:'Not used yet or Already used'}};
const INTENTS=[
 {id:'post',l:'Post ideas',hint:"Explain-only, no hands-on. Pick this week's post; keep 2–3 banked.",f:r=>r.a==='Post',cols:['p','fam','dec','d']},
 {id:'hands',l:'Hands-on',hint:'Try, measure, publish: PoC, own blog, pipeline stage or tool.',f:r=>['Small PoC','Own blog','Pipeline','Build a tool'].includes(r.a),cols:['a','p','fam','at','d']},
 {id:'ideas',l:'Tool & service ideas',hint:'Manual steps worth a tool, and migrations AWS is pushing.',f:r=>r.seed==='Tool idea'||r.seed==='Service idea',cols:['seed','fam','dec','d']},
 {id:'learn',l:'Learn',hint:'For interviews and design reviews; nothing to publish.',f:r=>r.a==='Learn only',cols:['fam','dec','ty','d']}
];
INTENTS.unshift({id:'all',l:'All',hint:'Every post (skipped ones only if switched on under View).',f:()=>true,cols:['a','p','fam','dec','d']});

/* ---------- data: embedded sample, data/ folder, or files you pick ---------- */
let ROWS=[],SRC='';
const pick=(o,...ks)=>{for(const k of ks){const v=o[k];if(v!=null&&v!=='')return v}return ''};
const list=(v,sep)=>Array.isArray(v)?v.map(String).map(s=>s.trim()).filter(Boolean):String(v).split(sep).map(s=>s.trim()).filter(Boolean);
function norm(o){
 const d=String(pick(o,'date','d','Date')).slice(0,10);
 return {d,m:String(pick(o,'month','m','Month'))||d.slice(0,7),t:String(pick(o,'title','t','Blog')),u:String(pick(o,'url','u','URL')),
  a:String(pick(o,'action','a','Action')),p:String(pick(o,'priority','p','Priority')),kp:list(pick(o,'key_points','kp','Key points'),/\n|•/),
  sv:String(pick(o,'services','sv','Services')),fit:String(pick(o,'stack_fit','fit','Stack fit')),ty:list(pick(o,'blog_types','ty','Blog type','Other types'),/·|\n/),
  aws:String(pick(o,'aws_type','aws','AWS post type + level','AWS post type')),seed:({'Tool seed':'Tool idea','Service seed':'Service idea','—':''})[String(pick(o,'seed','Seed'))]??String(pick(o,'seed','Seed')),dec:String(pick(o,'decision','dec','Decision it informs')),
  g:String(pick(o,'group','g','Group')),at:String(pick(o,'attaches_to','at','Attaches to')),au:String(pick(o,'authors','au','Company / authors')),st:({'New':'Not used yet','':'Not used yet'})[String(pick(o,'status','st','Status'))]||String(pick(o,'status','st','Status')),
  ms:String(pick(o,'main_service','Main service')),add:String(pick(o,'added','add')).slice(0,10)}
}
let NEWCUT='';
const dayStr=n=>{const d=new Date(Date.now()+n*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
/* stack fit + priority come from data/profile.json (one place to change); without it, the stored tags are used */
let PROFILE=null,TAGS=null;
function applyProfile(){if(!PROFILE)return;const U=new Set([...(PROFILE.used||[]),...(PROFILE.hands_on||[])]),P=new Set(PROFILE.path||[]);
 ROWS.forEach(r=>{const used=r.fam.some(f=>U.has(f)),path=r.fam.some(f=>P.has(f));if(!r.pin.fit)r.fit=used?'Used it':path?'New to me':'Off path';
  if(!r.pin.p)r.p=r.a==='Skip'?'Low':r.a==='Build a tool'?'High':used?'High':path?'Med':'Low'})}
/* data/tag_changes.json: later tag changes, keyed by post URL; they win over the month files */
const TK={action:'a',priority:'p',stack_fit:'fit',blog_types:'ty',seed:'seed',decision:'dec',group:'g',attaches_to:'at',status:'st',main_service:'ms',services:'sv',key_points:'kp'};
function applyTags(r){const c=TAGS&&TAGS[r.u];r.pin={};if(!c)return r;
 for(const [k,v] of Object.entries(c)){const s=TK[k];if(!s)continue;r[s]=(s==='ty'||s==='kp')?(Array.isArray(v)?v:list(v,s==='ty'?/·|\n/:/\n|•/)):String(v);r.pin[s]=1}
 r.chg={on:String(c.changed_on||''),why:String(c.why||''),by:String(c.by||'')};return r}
function load(items,src){
 const seen=new Set();
 ROWS=items.map(norm).map(applyTags).filter(r=>{const k=r.u||r.t;if(!r.t||seen.has(k))return false;seen.add(k);return true}).map((r,id)=>{
  const f=FAM.filter(([,re])=>re.test(r.sv+' '+r.ms)).map(([n])=>n);if(r.ms&&!FAM.some(([,re])=>re.test(r.ms))&&!f.includes(r.ms))f.push(r.ms);
  return {...r,id,fam:f.length?f:['Other'],hay:(r.t+' '+r.kp.join(' ')+' '+r.sv+' '+r.dec+' '+r.g+' '+r.at+' '+r.au).toLowerCase()}});
 NEWCUT=dayStr(-30);ROWS.forEach(r=>r.isNew=(r.add||r.d)>=NEWCUT);applyProfile();
 SRC=src;S.cur=null;render();
}
let UPD='',CHK='',RES='';
/* data is read from the folder next to this page, else from the public online copy (GitHub Pages) */
const REMOTE='https://bh00t.github.io/kv7q/abdp/data/';
const J=u=>fetch(u,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);
/* one sheet per year: only that year's month files are downloaded */
let YEARS=[],BASE=null,TOK=0;
const yearsOf=m=>[...new Set((m.months||[]).map(x=>String(x).slice(0,4)))].sort().reverse();
async function fromBase(base,y){
 const m=await (await fetch(base+'manifest.json',{cache:'no-cache'})).json();
 const ys=yearsOf(m);if(!ys.includes(y))y=ys[0];
 const [pr,tg,...parts]=await Promise.all([J(base+'profile.json'),J(base+'tag_changes.json'),...(m.months||[]).filter(x=>String(x).startsWith(y)).map(x=>J(`${base}${x}.json`))]);
 return {y,m,pr,tg:tg?(tg.posts||tg):null,all:parts.filter(Array.isArray).flat()};
}
/* last data of each year kept in this browser: a sheet shows instantly, then the fresh copy replaces it if anything changed */
const CK=y=>'pulse-cache-v2-'+y;
const sigOf=d=>JSON.stringify(d.m)+':'+JSON.stringify(d.tg||{}).length+':'+JSON.stringify(d.pr||{}).length+':'+d.all.length+':'+d.all.map(x=>x.url||x.u).join().length;
function renderYears(){const t=$('yrs');
 t.innerHTML=YEARS.map(y=>`<button role="tab" data-y="${y}" aria-selected="${y===S.year}">${y}</button>`).join('')}
$('bulb').onclick=e=>{e.stopPropagation();const p=$('bpop');p.hidden=!p.hidden;$('bulb').setAttribute('aria-expanded',!p.hidden)};
addEventListener('click',e=>{if(!$('bpop').hidden&&!e.target.closest('#bpop')){$('bpop').hidden=true;$('bulb').setAttribute('aria-expanded','false')}});
$('yrs').onclick=e=>{const b=e.target.closest('[data-y]');if(b&&b.dataset.y!==S.year)openYear(b.dataset.y)};
function show(d,label){PROFILE=d.pr||null;TAGS=d.tg||null;const m=d.m||{};UPD=String(m.updated||'');CHK=String(m.last_checked||'');RES=String(m.last_result||'');
 YEARS=yearsOf(m);S.year=d.y;if(CUR!==null)closeRec();renderYears();
 load(d.all,label||((UPD?`updated ${UPD}`:'')+(CHK?` · checked ${CHK}`:'')||'loaded'))}
async function openYear(y){
 const tok=++TOK;let sig='';S.year=y;renderYears();
 let c=null;try{c=JSON.parse(localStorage.getItem(CK(y))||'null')}catch(e){}
 if(c&&c.all&&c.all.length){sig=c.sig;show(c)}
 for(const base of BASE?[BASE]:['data/',REMOTE]){
  try{const d=await fromBase(base,y);if(tok!==TOK)return true;if(!d.all.length)continue;BASE=base;
   const s2=sigOf(d);if(s2!==sig||d.y!==y){const ku=CUR!==null&&ROWS[CUR]?ROWS[CUR].u:null;show(d);const r=ku&&ROWS.find(x=>x.u===ku);if(r)openRec(r.id)}
   try{localStorage.setItem(CK(d.y),JSON.stringify({...d,sig:s2}))}catch(e){}
   return true}catch(e){}
 }
 return !!c;
}
async function boot(){
 if(await openYear(S.year||String(new Date().getFullYear())))return;
 const emb=$('data').textContent.trim();
 if(emb&&emb[0]==='['){try{const v=JSON.parse(emb);if(v.length)return load(v,'sample data')}catch(e){}}
 load([],'');
}

/* ---------- state ---------- */

 const w=$('wrap');
 if(!ROWS.length){ORDER=[];w.innerHTML=emptyData();return}
 if(!rows.length){ORDER=[];w.innerHTML='<div class="empty">Nothing here with these filters. <button class="btn" data-x="clear">Clear filters</button></div>';return}
 const cols=colsOf();const span=cols.length+2;
 const arrow=k=>S.sort?(S.sort.k===k?(S.sort.dir>0?' ▲':' ▼'):''):(k==='d'?' ▼':'');
 setTW();w.innerHTML=`<table class="${S.wrap?'wraptxt':''}"><thead><tr><th class="rn"></th><th class="tc" data-k="t" title="Post title · ↗ opens it on AWS">Blog${arrow('t')}<span class="cr" data-cr="t"></span></th>${cols.map(k=>`<th data-k="${k}" data-c="${k}" ${cwS(k)} title="${esc(COL[k].h)}">${esc(COL[k].l)}${arrow(k)}<span class="cr" data-cr="${k}"></span></th>`).join('')}</tr></thead>
 <tbody>${(rows=sorted(rows),ORDER=rows.map(r=>r.id),rows.slice(0,Math.max(LIMIT,rows.findIndex(r=>r.id===HL)+1))).map((r,i)=>`<tr class="r ${HL===r.id?'cur':''}" data-id="${r.id}"><td class="rn">${i+1}</td><td class="tc">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener" title="Open on AWS" data-x="link">↗</a>`:''}${r.isNew?'<span class="newb">New</span>':''}${hl(r.t)}</td>${cols.map(k=>`<td data-c="${k}" ${cwS(k)}>${cell(r,k)}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length>LIMIT?`<div class="empty" id="moreRows">Showing ${LIMIT} of ${rows.length} · scroll for more</div>`:''}`;
}
/* drag a column header's right edge to resize; double-click the edge to fit the longest text */
let NOCLICK=0;
$('wrap').addEventListener('pointerdown',e=>{const h=e.target.closest('.cr');if(!h)return;e.preventDefault();e.stopPropagation();
 const k=h.dataset.cr,th=h.parentElement,x0=e.clientX,w0=th.getBoundingClientRect().width;h.classList.add('on');document.body.classList.add('colrs');
 const cells=k==='t'?null:document.querySelectorAll(`#wrap [data-c="${k}"]`);let w=w0;
 const mv=ev=>{w=Math.round(Math.min(1600,Math.max(60,w0+ev.clientX-x0)));
  if(k==='t')$('wrap').style.setProperty('--tw',w+'px');else cells.forEach(c=>{c.classList.add('cw');c.style.cssText=`--w:${w}px;width:${w}px;min-width:${w}px`})};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);h.classList.remove('on');document.body.classList.remove('colrs');
  if(Math.abs(w-w0)>2){S.cw=S.cw||{};S.cw[k]=w;NOCLICK=Date.now();save()}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)},true);
$('wrap').addEventListener('dblclick',e=>{const h=e.target.closest('.cr');if(!h)return;e.preventDefault();const k=h.dataset.cr;
 const cells=[...document.querySelectorAll(k==='t'?'#wrap .tc':`#wrap [data-c="${k}"]`)];let m=60;cells.forEach(c=>{m=Math.max(m,c.scrollWidth+2)});
 S.cw=S.cw||{};S.cw[k]=Math.min(1600,m);save();renderMain()});
$('wrap').onclick=e=>{if(e.target.closest('.cr')||Date.now()-NOCLICK<300)return;
 const x=e.target.closest('[data-x]');
 if(x){const a=x.dataset.x;if(a==='link')return;if(a==='clear')return clearAll()}
 const th=e.target.closest('thead th[data-k]');
 if(th){const k=th.dataset.k;S.sort=S.sort&&S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='d'?(S.sort?-1:1):1};return renderMain()}
 const tr=e.target.closest('tr.r');if(tr)openRec(+tr.dataset.id)};
$('wrap').addEventListener('scroll',()=>{const w=$('wrap');if(w.scrollTop+w.clientHeight>w.scrollHeight-400&&$('moreRows')){const y=w.scrollTop;LIMIT+=120;renderTable(filtered());w.scrollTop=y}},{passive:true});
function renderFoot(rows){
 const months=[...new Set(ROWS.map(r=>r.m))].filter(Boolean).sort();
 {const st=$('stale');const c=CHK?Date.parse(CHK.replace(' ','T')+':00+05:30'):NaN;const days=isNaN(c)?0:Math.floor((Date.now()-c)/864e5);st.hidden=!(days>5);if(days>5){st.textContent=`Last check ${days} days ago`;st.title='The scheduled update may have missed runs. It catches up automatically on the next run.'}}
 $('sub').textContent=ROWS.length?`${ROWS.length} posts · ${months[0]} to ${months[months.length-1]} · ${SRC}`:'no data loaded';
 const by={};rows.forEach(r=>by[r.p]=(by[r.p]||0)+1);
 $('bpop').innerHTML=ROWS.length?`<div><b>${rows.length}</b> shown of ${ROWS.length}${S.year&&YEARS.length?' in '+S.year:''}</div><div>`+ORD.p.filter(p=>by[p]).map(p=>`<span class="pill ${p}">${p}</span> ${by[p]}`).join(' &nbsp;')+`</div><div class="mut">Newest first · click a column header to sort</div><div class="mut">Click a row to open it${matchMedia('(pointer:coarse)').matches?'':' · ← → to move'}</div>`+(UPD||CHK?`<div class="mut">${UPD?'Updated '+esc(UPD):''}${CHK?' · checked '+esc(CHK):''}</div>`:''):'<div class="mut">Load data to start</div>';
}

/* ---------- glue ---------- */
function clearAll(){S.newOnly=false;S.dt={p:'any'};FACETS.forEach(f=>S.sel[f.k].clear());setQ('');$('q').value='';closeSug();S.find={};S.cur=null;render()}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function renderMain(){LIMIT=120;const rows=filtered();renderTabs();renderChips();renderTable(rows);renderFoot(rows);syncSheet();
 const side=$('side');FACETS.forEach(f=>{const d=side.querySelector(`details[data-k="${f.k}"]`);if(d&&!d.contains(document.activeElement)){const t=document.createElement('div');t.innerHTML=facetHTML(f);d.replaceWith(t.firstElementChild)}});
 const cl=side.querySelector('.shd');if(cl)cl.innerHTML=`<span>FILTERS</span>${anyFilter()?'<button class="link" data-a="clear">Clear all</button>':''}`;save()}
function syncSheet(){if(CUR===null)return;if(!ORDER.includes(CUR))closeRec();else fillSheet(ROWS[CUR])}
function render(){LIMIT=120;const rows=filtered();renderTabs();renderSide();renderChips();renderTable(rows);renderFoot(rows);syncSheet();if($('q'))syncQ();save()}
document.addEventListener('keydown',e=>{const q=$('q');
 if(e.key==='/'&&!(e.target.matches&&e.target.matches('input'))){e.preventDefault();q.focus()}
 const typing=e.target.matches&&e.target.matches('input');
 if(CUR!==null&&!typing){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1)}}
 if(e.key==='Escape'){if(!$('bpop').hidden){$('bpop').hidden=true;$('bulb').setAttribute('aria-expanded','false')}else if(CUR!==null)closeRec();else if(document.body.classList.contains('drawer'))document.body.classList.remove('drawer')}});
setQ(S.q);$('q').value=S.q;
boot();
}
</script>
</body>
